# Docker compose recipe for the vl-itree InvenTree deployment.
#
# Based on the official recipe at InvenTree tag 1.7.3:
#   https://github.com/inventree/InvenTree/blob/1.7.3/contrib/container/docker-compose.yml
#
# Containers:
# - PostgreSQL as the database backend
# - gunicorn as the InvenTree web server
# - django-q as the InvenTree background worker process
# - Caddy as the TLS-terminating reverse proxy
# - redis as the cache manager
#
# Do not run this file directly. Use run-itree.sh, which builds the runtime
# ../.env from docker/env.template, .env.local and docker/versions.env,
# validates it (passwords, bind address, TLS) and then calls docker compose.
#
# Differences from the official recipe (all deliberate):
# - Images are pinned by tag and digest from docker/versions.env.
# - Ports bind to an explicit address: plain HTTP only on 127.0.0.1, HTTPS on
#   INVENTREE_BIND_ADDR (default 127.0.0.1). Caddy listens on the same port
#   numbers inside the container, so the site URL and redirects line up.
# - The proxy and cache get only the variables they need (no env_file), so
#   database and admin credentials stay in the database, server and worker.
# - Caddy mounts only its own directories plus read-only static/media, instead
#   of the whole data volume.
# - The Caddyfile is vendored in docker/Caddyfile (see its header).
# - Owner-supplied certificates are mounted by docker-compose.tls-owner.yml.
#
# Container names, the 127.0.0.1 HTTP binding, PGDATA and the volume mounts
# are mirrored in lib/itree-config.sh; change both together
# (docs/configuration.md, "Script constants").

services:
    # Database service
    # Use PostgreSQL as the database backend
    inventree-db:
        image: postgres:${POSTGRES_TAG:?run via run-itree.sh}@${POSTGRES_DIGEST:?run via run-itree.sh}
        container_name: inventree-db
        expose:
            - ${INVENTREE_DB_PORT:-5432}/tcp
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=${INVENTREE_DB_USER:?You must provide the 'INVENTREE_DB_USER' variable in the .env file}
            - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD:?You must provide the 'INVENTREE_DB_PASSWORD' variable in the .env file}
            - POSTGRES_DB=${INVENTREE_DB_NAME:?You must provide the 'INVENTREE_DB_NAME' variable in the .env file}
        volumes:
            # Map 'data' volume such that postgres database is stored externally
            - ${INVENTREE_EXT_VOLUME:?You must specify the 'INVENTREE_EXT_VOLUME' variable in the .env file!}:/var/lib/postgresql/data/:z
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s
        restart: unless-stopped

    # redis acts as database cache manager
    inventree-cache:
        image: redis:${REDIS_TAG:?run via run-itree.sh}@${REDIS_DIGEST:?run via run-itree.sh}
        container_name: inventree-cache
        # Disable disk persistence to avoid permission errors on Windows bind mounts.
        # The /data volume is retained for layout consistency (#11100); cache data is ephemeral.
        command: redis-server --save "" --appendonly no
        expose:
            - ${INVENTREE_CACHE_PORT:-6379}
        volumes:
            - ${INVENTREE_EXT_VOLUME}/redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s
        restart: always

    # InvenTree web server service
    # Uses gunicorn as the web server
    inventree-server:
        image: inventree/inventree:${INVENTREE_TAG:?run via run-itree.sh}@${INVENTREE_DIGEST:?run via run-itree.sh}
        container_name: inventree-server
        # Only change this port if you understand the stack.
        expose:
            - ${INVENTREE_WEB_PORT:-8000}
        depends_on:
            inventree-db:
                condition: service_healthy
            inventree-cache:
                condition: service_healthy
        env_file:
            - ../.env
        environment:
            INVENTREE_SERVER: http://inventree-server:${INVENTREE_WEB_PORT:-8000}
        volumes:
            # Data volume must map to /home/inventree/data
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'invoke server-health --address "http://localhost:$${INVENTREE_WEB_PORT:-8000}"',
                ]
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 60s
        restart: unless-stopped

    # Background worker process handles long-running or periodic tasks
    inventree-worker:
        image: inventree/inventree:${INVENTREE_TAG:?run via run-itree.sh}@${INVENTREE_DIGEST:?run via run-itree.sh}
        container_name: inventree-worker
        command: invoke worker
        depends_on:
            inventree-server:
                condition: service_healthy
        env_file:
            - ../.env
        volumes:
            # Data volume must map to /home/inventree/data
            - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
        healthcheck:
            test: ['CMD-SHELL', 'invoke worker-health']
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 180s
        restart: unless-stopped

    # caddy acts as reverse proxy, TLS terminator and static file server
    # https://hub.docker.com/_/caddy
    inventree-proxy:
        container_name: inventree-proxy
        image: caddy:${CADDY_TAG:?run via run-itree.sh}@${CADDY_DIGEST:?run via run-itree.sh}
        restart: always
        depends_on:
            inventree-server:
                condition: service_healthy
            inventree-worker:
                condition: service_healthy
        ports:
            # Plain HTTP: loopback only. For https:// site URLs Caddy uses this
            # listener only to redirect to HTTPS.
            - 127.0.0.1:${INVENTREE_HTTP_PORT:?run via run-itree.sh}:${INVENTREE_HTTP_PORT}
            # HTTPS: the only listener that may be reachable from other hosts.
            - ${INVENTREE_BIND_ADDR:?run via run-itree.sh}:${INVENTREE_HTTPS_PORT:?run via run-itree.sh}:${INVENTREE_HTTPS_PORT}
        environment:
            INVENTREE_SITE_URL: ${INVENTREE_SITE_URL:?run via run-itree.sh}
            INVENTREE_SERVER: http://inventree-server:${INVENTREE_WEB_PORT:-8000}
            INVENTREE_HTTP_PORT: ${INVENTREE_HTTP_PORT}
            INVENTREE_HTTPS_PORT: ${INVENTREE_HTTPS_PORT}
            INVENTREE_PROXY_TLS: ${INVENTREE_PROXY_TLS:?run via run-itree.sh}
        healthcheck:
            test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/api/system/health/']
            interval: 20s
            timeout: 5s
            retries: 10
            start_period: 20s
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
            - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:ro,z
            - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:ro,z
            # Caddy state: internal CA (data/caddy/pki), autosaved config, logs
            - ${INVENTREE_EXT_VOLUME}/caddy/log:/var/log/caddy:z
            - ${INVENTREE_EXT_VOLUME}/caddy/data:/data:z
            - ${INVENTREE_EXT_VOLUME}/caddy/config:/config:z
